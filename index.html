<style>
:root{color-scheme:dark;--bg:#0c1728;--card:#182c44;--line:#30445e;--txt:#edf5ff;--muted:#a8bfd5;--blue:#69a5ff;--green:#62d3a7;--yellow:#ffcf79}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header,main{max-width:960px;margin:auto;padding:17px}header{padding-bottom:5px}h1{font-size:26px;margin:8px 0}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:12px 0}p{line-height:1.55}.muted,small{color:var(--muted)}.status{padding:10px 12px;background:#233d58;border-radius:9px;margin:12px 0;font-size:13px}.ok{color:var(--green)}.warn{color:var(--yellow)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:17px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}.metric{font-size:21px;font-weight:750;margin-top:6px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:12px}.tabs{display:flex;overflow-x:auto;gap:7px;padding:5px 0 12px;position:sticky;top:0;background:var(--bg);z-index:3}.tabs button{flex-shrink:0;background:#233c56;color:#eef5ff;border:1px solid #476481;font-weight:750}.tabs button:hover{background:#345779;color:#fff}.tabs button.sel{background:var(--blue);color:#07182c;border-color:#94c4ff}button,input,select,textarea{font:inherit;border-radius:9px;padding:11px}button{border:0;background:var(--blue);color:#0b2036;font-weight:700;cursor:pointer}button.secondary{background:#2d4a68;color:var(--txt)}button.danger{background:#643d47;color:#fff}button:disabled{opacity:.45}label{display:block;color:var(--muted);font-size:13px;margin-bottom:10px}input,select,textarea{width:100%;margin-top:5px;background:#f8fbff;color:#102036;border:1px solid #acc1d1;min-height:43px}textarea{min-height:70px}a{color:#9fc8ff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.entry{border-top:1px solid var(--line);padding:13px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}.entry b,.entry small{overflow-wrap:anywhere}.entry .actions{margin:0;flex-wrap:nowrap}.entry .actions button{padding:8px 10px;font-size:13px}.entry .row{display:contents}.entry .row>div:first-child{min-width:0}@media(max-width:520px){.entry .actions button{padding:7px;font-size:12px}.entry{gap:6px}.entry .row>div:first-child{min-width:0}}.entry b{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.chip{border:1px solid #52718d;border-radius:30px;padding:3px 9px;color:var(--muted);font-size:12px}progress{width:100%;height:12px;accent-color:var(--green)}.hidden{display:none!important}nav{padding-bottom:15px}.pill{color:var(--green);font-size:12px;font-weight:700}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#bcd4eb}.bar{height:9px;background:#354965;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:var(--blue)}.fine{font-size:12px;color:var(--muted)}details summary{cursor:pointer;padding:8px 0}#toast{white-space:pre-wrap}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}} 
 .sheet-scroll{max-height:65vh;overflow:auto;position:relative;border:1px solid var(--line);border-radius:9px}.sheet-scroll table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}.sheet-scroll thead th{position:sticky;top:0;z-index:2;background:#294767;color:#fff;box-shadow:0 2px 0 #537491;white-space:nowrap}.sheet-scroll td{white-space:nowrap}.sheet-scroll th:first-child,.sheet-scroll td:first-child{position:sticky;left:0;background:#233b56;z-index:1}.sheet-scroll thead th:first-child{z-index:3;background:#294767} </style><script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header><div class="row"><div><div class="pill">CONTROLE PARTICULAR DA CONSTRUÇÃO</div><h1>🏗️ Minha Obra</h1></div><span id="account" class="chip">Microsoft desconectado</span></div><p class="muted">Cronograma, medições da Caixa, gastos, materiais e fluxo financeiro. Seus registros ficam no seu OneDrive pessoal.</p><div id="toast" class="status">Iniciando...</div><div class="actions"><button onclick="openLogin()">🔐 Entrar com Microsoft</button><button class="secondary" onclick="openSettings()">⚙️ Configurações</button></div></header>
<main><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<script>
const URI='https://djanilton.github.io/minha-obra-app/',AUTH='https://login.microsoftonline.com/consumers',SCOPES=['User.Read','Files.ReadWrite'];
const KEY='minha-obra-clientid',STORAGE='minha-obra-completa-local-v1';
const tabs=[['inicio','🏠 Resumo'],['etapas','✅ Etapas'],['tarefas','📅 Pendências'],['gastos','💰 Despesas'],['materiais','🧱 Materiais'],['financiamento','🏦 Caixa'],['fluxo','📊 Fluxo'],['sacExcel','📑 Financiamento_SAC'],['caixaExcel','📑 Fluxo_Caixa'],['projFin','📘 Projeção Financiamento'],['projReserva','📘 Projeção Reserva e CDI'],['premissasExcel','📋 Premissas'],['parametrosExcel','📋 Parâmetros'],['indicadoresExcel','📊 Indicadores'],['painel','📈 Painel'],['cronograma','🗓️ Cronograma'],['pci','📋 PCI'],['documentos','📁 Documentos'],['ajustes','⚙️ Config.']];
let auth=null,user=null,tab='inicio',state=null,baseRev=null,lastCloud=null,syncing=false,dirty=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'Sem data',today=()=>new Date().toISOString().slice(0,10),uuid=()=>crypto.randomUUID(),msg=s=>{$('toast').textContent=s};
function empty(){return {version:2,items:{etapas:[],tarefas:[],gastos:[],materiais:[],parcelas:[],documentos:[],meses:[]},meta:{updated:new Date().toISOString(),project:'Minha Obra'}}}
function init(){try{let v=JSON.parse(localStorage.getItem(STORAGE));if(v?.items) return v}catch{}return empty()}
function ensure(){for(let k of Object.keys(empty().items))if(!Array.isArray(state.items[k]))state.items[k]=[]}
function persist(){state.meta.updated=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(state));dirty=true;render();scheduleSync()}
function list(k){return state.items[k]||[]}
const total=(k,filter=()=>true)=>list(k).filter(filter).reduce((a,x)=>a+(+x.valor||0),0);
function amount(k){return money(total(k))}
function field(name,label,type='text',value='',opts){return '<label>'+label+(opts?'<select name="'+name+'">'+opts.map(x=>'<option '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'">')+'</label>'}
function form(k,fields,edit){let it=edit||{};return '<form id="form"><div class="grid">'+fields.map(x=>field(x[0],x[1],x[2]||'text',it[x[0]]??x[3]??'',x[4])).join('')+'</div>'+field('nota','Observações','text',it.nota||'')+'<div class="actions"><button type="submit">'+(edit?'Atualizar':'Adicionar')+'</button><button type="button" class="secondary" onclick="render()">Cancelar</button></div></form>'}
function attachForm(k,editId){let it=list(k).find(x=>x.id===editId);let specs={
etapas:[['nome','Etapa'],['valor','Valor contratado (R$)','number'],['mesInicio','Mês início (AAAA-MM)','month'],['mesFim','Mês final (AAAA-MM)','month'],['progresso','Progresso %','number','0'],['status','Situação','text','Planejada',['Planejada','Em andamento','Concluída']]],
tarefas:[['nome','Pendência'],['prazo','Prazo','date'],['responsavel','Responsável'],['prioridade','Prioridade','text','Média',['Baixa','Média','Alta']],['status','Status','text','Pendente',['Pendente','Em andamento','Concluída']]],
gastos:[['nome','Descrição'],['valor','Valor (R$)','number'],['data','Data','date',today()],['categoria','Categoria','text','Extra',['Construtora','Caixa','Arquiteta','Projeto','Material','Documentação','Financiamento','Extra']],['status','Condição','text','Previsto',['Previsto','Pago']],['etapa','Etapa / referência']],
materiais:[['nome','Material / substituição'],['quantidade','Quantidade','number','1'],['valorOriginal','Preço original total (R$)','number','0'],['valorNovo','Preço atualizado total (R$)','number','0'],['status','Condição','text','Orçado',['Orçado','Comprado']]],
parcelas:[['nome','Identificação da parcela'],['competencia','Mês','month'],['valor','Valor (R$)','number'],['status','Condição','text','Simulado',['Simulado','Previsto','Pago']],['saldo','Saldo devedor','number']],
documentos:[['nome','Documento'],['url','URL privada no OneDrive ou SharePoint','url'],['tipo','Tipo','text','Contrato',['Contrato','Caixa','Projeto','Comprovante','Foto','Outros']],['status','Situação','text','Referência',['Referência','Pendente','Validado']]],
meses:[['nome','Descrição do fluxo'],['competencia','Mês','month'],['entrada','Entrada prevista (R$)','number','0'],['saida','Saída prevista (R$)','number','0'],['origem','Origem','text','Manual',['Manual','Cronograma','Financiamento','Caixa','FGTS','Outros']]]};
$('view').innerHTML='<div class="card"><h2>'+(it?'Editar':'Novo')+' registro</h2>'+form(k,specs[k],it)+'</div>';
$('form').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));Object.keys(obj).forEach(x=>{if(['valor','valorOriginal','valorNovo','quantidade','entrada','saida','saldo','progresso'].includes(x))obj[x]=Number(obj[x]||0)});if(!obj.nome?.trim())return alert('Preencha a descrição');const item={...it,...obj,id:it?.id||uuid(),updated:new Date().toISOString()};if(it)state.items[k]=list(k).map(x=>x.id===it.id?item:x);else state.items[k].push(item);persist()}}
function remove(k,id){if(!confirm('Excluir este registro?'))return;state.items[k]=list(k).filter(x=>x.id!==id);persist()}
function rows(k,extra){const a=list(k);return a.length?a.map(x=>'<div class="entry"><div class="row"><div><b>'+esc(x.nome)+'</b><small>'+esc(extra(x))+'</small></div><div class="actions"><button class="secondary" onclick="attachForm(\''+k+'\',\''+x.id+'\')">Editar</button><button class="danger" onclick="remove(\''+k+'\',\''+x.id+'\')">×</button></div></div></div>').join(''):'<p class="muted">Ainda não há registros nesta categoria.</p>'}
function summary(){let p=total('gastos',x=>x.status==='Pago'),v=total('gastos',x=>x.status==='Previsto');let stages=list('etapas'),av=stages.length?stages.reduce((a,x)=>a+(+x.progresso||0),0)/stages.length:0;let overdue=list('tarefas').filter(x=>x.prazo&&x.prazo<today()&&x.status!=='Concluída').length;
return (!user?'<div class="card"><h2>🔐 Conectar OneDrive</h2><p>Entre com sua conta Microsoft para carregar os dados privados da obra.</p><button onclick="openLogin()">Conectar Microsoft</button></div>':'')+'<div class="cards"><div class="card"><small>Pago / lançado</small><div class="metric">'+money(p)+'</div></div><div class="card"><small>A pagar</small><div class="metric">'+money(v)+'</div></div><div class="card"><small>Progresso médio</small><div class="metric">'+av.toFixed(1)+'%</div><progress max="100" value="'+av+'"></progress></div><div class="card"><small>Pendências atrasadas</small><div class="metric">'+overdue+'</div></div></div><div class="card"><h2>Próximas pendências</h2>'+list('tarefas').filter(x=>x.status!=='Concluída').sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999')).slice(0,6).map(x=>'<div class="entry"><b>'+esc(x.nome)+'</b><small>'+date(x.prazo)+' • '+esc(x.prioridade||'')+'</small></div>').join('')+'</div><div class="card"><h2>Origem e integridade dos dados</h2><p>Dados privados sincronizados com a pasta de aplicativo do seu OneDrive. A importação do histórico é separada e não considera simulações como pagamentos realizados.</p></div>'}
function panel(k,title,desc,extra){return '<div class="card"><div class="row"><h2>'+title+'</h2><button onclick="attachForm(\''+k+'\')">+ Adicionar</button></div><p class="muted">'+desc+'</p>'+rows(k,extra)+'</div>'}
function financing(){const a=list('parcelas');const vals=a.filter(x=>x.status==='Simulado'),paid=a.filter(x=>x.status==='Pago');return financeIndicators()+'<div class="cards"><div class="card"><small>Parcelas simuladas</small><div class="metric">'+vals.length+'</div></div><div class="card"><small>Parcelas pagas</small><div class="metric">'+paid.length+'</div></div><div class="card"><small>Total pago informado</small><div class="metric">'+money(paid.reduce((a,x)=>a+(+x.valor||0),0))+'</div></div><div class="card"><small>Próxima simulação</small><div class="metric">'+money(vals.sort((a,b)=>a.competencia.localeCompare(b.competencia))[0]?.valor)+'</div></div></div>'+panel('parcelas','Financiamento e parcelas','Valores simulados não são débitos reais. Compare com as cobranças da Caixa antes de marcar como pagos.',x=>x.competencia+' • '+money(x.valor)+' • '+x.status+(x.saldo?' • saldo '+money(x.saldo):''))}
function flow(){const map={};const cell=m=>map[m]||(map[m]={mes:m,entradas:0,planejado:0,parcelas:0,despesas:0});list('meses').forEach(x=>{if(!x.competencia)return;let d=cell(x.competencia);d.entradas+=+x.entrada||0;d.planejado+=+x.saida||0});list('parcelas').filter(x=>x.status!=='Pago'&&x.competencia).sort((a,b)=>a.competencia.localeCompare(b.competencia)).forEach((x,i)=>{cell(x.competencia).parcelas+=i<12?1500:(+x.valor||0)});list('gastos').filter(x=>x.status==='Previsto'&&x.data).forEach(x=>{cell(x.data.slice(0,7)).despesas+=+x.valor||0});const arr=Object.values(map).sort((x,y)=>x.mes.localeCompare(y.mes));let acumulado=0;const rows=arr.map(x=>{let total=x.planejado+x.parcelas+x.despesas,liquido=x.entradas-total;acumulado+=liquido;return '<tr><td>'+esc(x.mes)+'</td><td>'+money(x.entradas)+'</td><td>'+money(x.planejado)+'</td><td>'+money(x.parcelas)+'</td><td>'+money(x.despesas)+'</td><td>'+money(liquido)+'</td><td>'+money(acumulado)+'</td></tr>'}).join('');return '<div class="card"><h2>Fluxo mensal — composição</h2><p class="fine">Previsão nominal baseada nos registros existentes. Saídas informadas manualmente, prestações simuladas e despesas previstas são separadas para facilitar identificar duplicações. Não representa saldo bancário nem disponibilidade efetiva da Caixa.</p><div class="tablewrap"><table><tr><th>Mês</th><th>Entradas</th><th>Saídas manuais</th><th>Parcelas</th><th>Extras previstos</th><th>Líquido</th><th>Acumulado</th></tr>'+rows+'</table></div>'+(arr.length?'':'<p class="muted">Inclua movimentos mensais, parcelas ou despesas com data.</p>')+'</div>'+panel('meses','Entradas e saídas programadas','Registre desembolsos e liberações apenas uma vez. Liberações previstas não significam créditos confirmados.',x=>esc(x.competencia)+' • +'+money(x.entrada)+' / -'+money(x.saida)+' • '+esc(x.origem))}function materials(){let diff=list('materiais').reduce((a,x)=>a+(+x.valorNovo||0)-(+x.valorOriginal||0),0);return '<div class="card"><small>Diferença acumulada entre materiais</small><div class="metric">'+money(diff)+'</div><p class="fine">Valor positivo indica acréscimo, negativo indica economia, sem duplicar automaticamente como despesa.</p></div>'+panel('materiais','Substituições e diferenças','Registre o custo original e o custo atualizado da mesma quantidade.',x=>money(x.valorOriginal)+' → '+money(x.valorNovo)+' • diferença '+money((+x.valorNovo||0)-(+x.valorOriginal||0)))}
function doc(){return panel('documentos','Arquivos da obra','Links privados do OneDrive ou SharePoint. Nenhum documento é publicado no GitHub.',x=>esc(x.tipo)+' • '+esc(x.status)+(x.url?' • <a target="_blank" rel="noopener" href="'+esc(x.url)+'">Abrir arquivo</a>':''))}


function pciView(){const f=state.meta?.finance||{},p=f.pci||{},q=f.planilha||{};let names=[['Terreno','terreno'],['Construção','construcao'],['Total','total']];const cell=x=>x==null?'A importar':money(x);return '<div class="card"><h2>Terreno — conciliação da escritura</h2><p>Valor efetivamente pago: <b>'+cell(q.terreno)+'</b></p><p>Valor declarado na escritura: <b>'+cell(p.terreno)+'</b></p><p>Diferença a documentar: <b>'+(q.terreno==null||p.terreno==null?'Não calculada':money(q.terreno-p.terreno))+'</b></p><p class="fine">Diferença de informação documental; não é despesa extra nem indicação automática de irregularidade. Guarde escritura e comprovantes e consulte o cartório/profissional responsável se precisar corrigir.</p></div><div class="card"><h2>PCI da Caixa × Planilha</h2><p class="fine">Valores lidos exclusivamente dos metadados privados sincronizados, quando disponíveis.</p><div class="tablewrap"><table><tr><th>Referência</th><th>PCI</th><th>Planilha</th><th>Diferença</th></tr>'+names.map(([label,key])=>'<tr><td>'+label+'</td><td>'+cell(p[key])+'</td><td>'+cell(q[key])+'</td><td>'+(p[key]==null||q[key]==null?'—':money(q[key]-p[key]))+'</td></tr>').join('')+'</table></div><p class="fine">Não altere valores contratuais sem conferir com a Caixa. Fontes diferentes não são automaticamente inconsistências de pagamento.</p></div><div class="card"><h2>Origem dos recursos</h2>'+[['Financiamento',q.financiado],['FGTS previsto',q.fgtsPrevisto],['Recursos próprios',q.recursosProprios]].map(([l,v])=>'<div class="entry"><div><b>'+l+'</b><small>'+(v==null?'Não importado':money(v))+'</small></div></div>').join('')+'</div>'}
function contractCalendar(){const a=list('etapas'),sum=a.reduce((n,x)=>n+(+x.valor||0),0);return '<div class="card"><h2>Cronograma físico-financeiro</h2><p class="fine">Cada barra representa progresso informado, não pagamento ou medição aprovada. Defina o início e fim de cada etapa ao confirmar o calendário da construtora.</p>'+a.map(x=>{const percent=Math.max(0,Math.min(100,+x.progresso||0));return '<div class="entry"><div><b>'+esc(x.nome)+'</b><small>'+money(x.valor)+' • '+(x.mesInicio||'Início a confirmar')+' até '+(x.mesFim||'fim a confirmar')+' • '+percent+'%</small><div class="bar"><span style="width:'+percent+'%"></span></div></div><span class="chip">'+esc(x.status||'Planejada')+'</span></div>'}).join('')+'<h3>Total de etapas: '+money(sum)+'</h3></div>'}
function financeIndicators(){const a=list('parcelas').filter(x=>x.competencia).sort((x,y)=>x.competencia.localeCompare(y.competencia));if(!a.length)return '<div class="card"><p>Importe as parcelas da planilha para visualizar a evolução mensal.</p></div>';const max=Math.max(1,...a.map(x=>+x.valor||0));return '<div class="card"><h2>Parcelas projetadas — próximos registros</h2><p class="fine">Prestações de simulação não equivalem a valores cobrados pelo banco. Informe pagamentos reais separadamente.</p>'+a.slice(0,24).map(x=>'<div class="entry"><div><b>'+esc(x.competencia)+' • '+money(a.indexOf(x)<12?1500:x.valor)+'</b><small>'+ (a.indexOf(x)<12?'Parcela de construção informada • simulação original '+money(x.valor)+' • ':'')+esc(x.status||'Simulado')+(x.saldo==null?'':' • Saldo '+money(x.saldo))+'</small><div class="bar"><span style="width:'+Math.round(100*(+x.valor||0)/max)+'%"></span></div></div></div>').join('')+'</div>'}

function financeConfigForm(){const q=financeModel();const a=[['credito','Crédito Caixa (R$)',q.credito],['fgts','FGTS separado (R$)',q.fgts],['taxa','Juros financiamento anual (%)',q.taxa],['cet','CET anual (%)',q.cet],['cdi','CDI anual previsto (%)',q.cdi],['cdb','CDB (% CDI)',q.cdb],['ir','IR estimado sobre rendimento (%)',q.ir],['reserva','Reserva inicial (R$)',q.reserva],['aporte','Aporte mensal após obra (R$)',q.aporte],['cobertura','Parcela paga com salário/outras fontes (R$)',q.cobertura??0],['plr','PLR anual para investir/amortizar (R$)',q.plr??10000],['fgtsBienal','FGTS adicional bienal para amortizar (R$)',q.fgtsBienal??30000],['extraAvulso','Aporte avulso (R$)',q.extraAvulso??0],['mesExtra','Mês do aporte avulso (1–60)',q.mesExtra??13],['percentInvestir','Parcela da PLR destinada ao CDB (%)',q.percentInvestir??100]];return '<div class="card"><h2>Premissas da simulação</h2><p class="fine">Use números da planilha atualizada. CDI, juros e custos são cenários, não cotações ou cobranças confirmadas.</p><form id="modelForm"><div class="grid">'+a.map(x=>'<label>'+x[1]+'<input type="number" step="any" name="'+x[0]+'" value="'+(x[2]??'')+'" placeholder="Preencher"></label>').join('')+'</div><button>Salvar premissas no OneDrive</button></form></div>'}
