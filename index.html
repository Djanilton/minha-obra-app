<style>

1fr) auto;align-items:center;gap:10px}.entry b,.entry small{overflow-wrap:anywhere}.entry .actions{margin:0;flex-wrap:nowrap}.entry .actions button{padding:8px 10px;font-size:13px}.entry .row{display:contents}.entry .row>div:first-child{min-width:0}@media(max-width:520px){.entry .actions button{padding:7px;font-size:12px}.entry{gap:6px}.entry .row>div:first-child{min-width:0}}.entry b{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}.chip{border:1px solid #52718d;border-radius:30px;padding:3px 9px;color:var(--muted);font-size:12px}progress{width:100%;height:12px;accent-color:var(--green)}.hidden{display:none!important}nav{padding-bottom:15px}.pill{color:var(--green);font-size:12px;font-weight:700}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:#bcd4eb}.bar{height:9px;background:#354965;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:var(--blue)}.fine{font-size:12px;color:var(--muted)}details summary{cursor:pointer;padding:8px 0}#toast{white-space:pre-wrap}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}} 
</style><script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></head><body><header><div class="row"><div><div class="pill">CONTROLE PARTICULAR DA CONSTRUÇÃO</div><h1>🏗️ Minha Obra</h1></div><span id="account" class="chip">Microsoft desconectado</span></div><p class="muted">Cronograma, medições da Caixa, gastos, materiais e fluxo financeiro. Seus registros ficam no seu OneDrive pessoal.</p><div id="toast" class="status">Iniciando...</div><div class="actions"><button onclick="openLogin()">🔐 Entrar com Microsoft</button><button class="secondary" onclick="openSettings()">⚙️ Configurações</button></div></header>
<main><nav class="tabs" id="tabs"></nav><div id="view"></div></main>
<script>
const URI='https://djanilton.github.io/minha-obra-app/',AUTH='https://login.microsoftonline.com/consumers',SCOPES=['User.Read','Files.ReadWrite'];
const KEY='minha-obra-clientid',STORAGE='minha-obra-completa-local-v1';
const tabs=[['inicio','🏠 Resumo'],['etapas','✅ Etapas'],['tarefas','📅 Pendências'],['gastos','💰 Despesas'],['materiais','🧱 Materiais'],['financiamento','🏦 Caixa'],['fluxo','📊 Fluxo'],['cronograma','🗓️ Cronograma'],['pci','📋 PCI'],['documentos','📁 Documentos'],['ajustes','⚙️ Config.']];
let auth=null,user=null,tab='inicio',state=null,baseRev=null,lastCloud=null,syncing=false,dirty=false;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),date=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'Sem data',today=()=>new Date().toISOString().slice(0,10),uuid=()=>crypto.randomUUID(),msg=s=>{$('toast').textContent=s};
function empty(){return {version:2,items:{etapas:[],tarefas:[],gastos:[],materiais:[],parcelas:[],documentos:[],meses:[]},meta:{updated:new Date().toISOString(),project:'Minha Obra'}}}
function init(){try{let v=JSON.parse(localStorage.getItem(STORAGE));if(v?.items) return v}catch{}return empty()}
function ensure(){for(let k of Object.keys(empty().items))if(!Array.isArray(state.items[k]))state.items[k]=[]}
function persist(){state.meta.updated=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(state));dirty=true;render();scheduleSync()}
function list(k){return state.items[k]||[]}
const total=(k,filter=()=>true)=>list(k).filter(filter).reduce((a,x)=>a+(+x.valor||0),0);
function amount(k){return money(total(k))}
function field(name,label,type='text',value='',opts){return '<label>'+label+(opts?'<select name="'+name+'">'+opts.map(x=>'<option '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'">')+'</label>'}
function form(k,fields,edit){let it=edit||{};return '<form id="form"><div class="grid">'+fields.map(x=>field(x[0],x[1],x[2]||'text',it[x[0]]??x[3]??'',x[4])).join('')+'</div>'+field('nota','Observações','text',it.nota||'')+'<div class="actions"><button type="submit">'+(edit?'Atualizar':'Adicionar')+'</button><button type="button" class="secondary" onclick="render()">Cancelar</button></div></form>'}
function attachForm(k,editId){let it=list(k).find(x=>x.id===editId);let specs={
etapas:[['nome','Etapa'],['valor','Valor contratado (R$)','number'],['mesInicio','Mês início (AAAA-MM)','month'],['mesFim','Mês final (AAAA-MM)','month'],['progresso','Progresso %','number','0'],['status','Situação','text','Planejada',['Planejada','Em andamento','Concluída']]],
tarefas:[['nome','Pendência'],['prazo','Prazo','date'],['responsavel','Responsável'],['prioridade','Prioridade','text','Média',['Baixa','Média','Alta']],['status','Status','text','Pendente',['Pendente','Em andamento','Concluída']]],
gastos:[['nome','Descrição'],['valor','Valor (R$)','number'],['data','Data','date',today()],['categoria','Categoria','text','Extra',['Construtora','Caixa','Arquiteta','Projeto','Material','Documentação','Financiamento','Extra']],['status','Condição','text','Previsto',['Previsto','Pago']],['etapa','Etapa / referência']],
materiais:[['nome','Material / substituição'],['quantidade','Quantidade','number','1'],['valorOriginal','Preço original total (R$)','number','0'],['valorNovo','Preço atualizado total (R$)','number','0'],['status','Condição','text','Orçado',['Orçado','Comprado']]],
parcelas:[['nome','Identificação da parcela'],['competencia','Mês','month'],['valor','Valor (R$)','number'],['status','Condição','text','Simulado',['Simulado','Previsto','Pago']],['saldo','Saldo devedor','number']],
documentos:[['nome','Documento'],['url','URL privada no OneDrive ou SharePoint','url'],['tipo','Tipo','text','Contrato',['Contrato','Caixa','Projeto','Comprovante','Foto','Outros']],['status','Situação','text','Referência',['Referência','Pendente','Validado']]],
meses:[['nome','Descrição do fluxo'],['competencia','Mês','month'],['entrada','Entrada prevista (R$)','number','0'],['saida','Saída prevista (R$)','number','0'],['origem','Origem','text','Manual',['Manual','Cronograma','Financiamento','Caixa','FGTS','Outros']]]};
$('view').innerHTML='<div class="card"><h2>'+(it?'Editar':'Novo')+' registro</h2>'+form(k,specs[k],it)+'</div>';
$('form').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));Object.keys(obj).forEach(x=>{if(['valor','valorOriginal','valorNovo','quantidade','entrada','saida','saldo','progresso'].includes(x))obj[x]=Number(obj[x]||0)});if(!obj.nome?.trim())return alert('Preencha a descrição');const item={...it,...obj,id:it?.id||uuid(),updated:new Date().toISOString()};if(it)state.items[k]=list(k).map(x=>x.id===it.id?item:x);else state.items[k].push(item);persist()}}
function remove(k,id){if(!confirm('Excluir este registro?'))return;state.items[k]=list(k).filter(x=>x.id!==id);persist()}
function rows(k,extra){const a=list(k);return a.length?a.map(x=>'<div class="entry"><div class="row"><div><b>'+esc(x.nome)+'</b><small>'+esc(extra(x))+'</small></div><div class="actions"><button class="secondary" onclick="attachForm(\''+k+'\',\''+x.id+'\')">Editar</button><button class="danger" onclick="remove(\''+k+'\',\''+x.id+'\')">×</button></div></div></div>').join(''):'<p class="muted">Ainda não há registros nesta categoria.</p>'}
function summary(){let p=total('gastos',x=>x.status==='Pago'),v=total('gastos',x=>x.status==='Previsto');let stages=list('etapas'),av=stages.length?stages.reduce((a,x)=>a+(+x.progresso||0),0)/stages.length:0;let overdue=list('tarefas').filter(x=>x.prazo&&x.prazo<today()&&x.status!=='Concluída').length;
return (!user?'<div class="card"><h2>🔐 Conectar OneDrive</h2><p>Entre com sua conta Microsoft para carregar os dados privados da obra.</p><button onclick="openLogin()">Conectar Microsoft</button></div>':'')+'<div class="cards"><div class="card"><small>Pago / lançado</small><div class="metric">'+money(p)+'</div></div><div class="card"><small>A pagar</small><div class="metric">'+money(v)+'</div></div><div class="card"><small>Progresso médio</small><div class="metric">'+av.toFixed(1)+'%</div><progress max="100" value="'+av+'"></progress></div><div class="card"><small>Pendências atrasadas</small><div class="metric">'+overdue+'</div></div></div><div class="card"><h2>Próximas pendências</h2>'+list('tarefas').filter(x=>x.status!=='Concluída').sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999')).slice(0,6).map(x=>'<div class="entry"><b>'+esc(x.nome)+'</b><small>'+date(x.prazo)+' • '+esc(x.prioridade||'')+'</small></div>').join('')+'</div><div class="card"><h2>Origem e integridade dos dados</h2><p>Dados privados sincronizados com a pasta de aplicativo do seu OneDrive. A importação do histórico é separada e não considera simulações como pagamentos realizados.</p></div>'}
function panel(k,title,desc,extra){return '<div class="card"><div class="row"><h2>'+title+'</h2><button onclick="attachForm(\''+k+'\')">+ Adicionar</button></div><p class="muted">'+desc+'</p>'+rows(k,extra)+'</div>'}
function financing(){const a=list('parcelas');const vals=a.filter(x=>x.status==='Simulado'),paid=a.filter(x=>x.status==='Pago');return financeIndicators()+'<div class="cards"><div class="card"><small>Parcelas simuladas</small><div class="metric">'+vals.length+'</div></div><div class="card"><small>Parcelas pagas</small><div class="metric">'+paid.length+'</div></div><div class="card"><small>Total pago informado</small><div class="metric">'+money(paid.reduce((a,x)=>a+(+x.valor||0),0))+'</div></div><div class="card"><small>Próxima simulação</small><div class="metric">'+money(vals.sort((a,b)=>a.competencia.localeCompare(b.competencia))[0]?.valor)+'</div></div></div>'+panel('parcelas','Financiamento e parcelas','Valores simulados não são débitos reais. Compare com as cobranças da Caixa antes de marcar como pagos.',x=>x.competencia+' • '+money(x.valor)+' • '+x.status+(x.saldo?' • saldo '+money(x.saldo):''))}
function flow(){const map={};const cell=m=>map[m]||(map[m]={mes:m,entradas:0,planejado:0,parcelas:0,despesas:0});list('meses').forEach(x=>{if(!x.competencia)return;let d=cell(x.competencia);d.entradas+=+x.entrada||0;d.planejado+=+x.saida||0});list('parcelas').filter(x=>x.status!=='Pago'&&x.competencia).sort((a,b)=>a.competencia.localeCompare(b.competencia)).forEach((x,i)=>{cell(x.competencia).parcelas+=i<12?1500:(+x.valor||0)});list('gastos').filter(x=>x.status==='Previsto'&&x.data).forEach(x=>{cell(x.data.slice(0,7)).despesas+=+x.valor||0});const arr=Object.values(map).sort((x,y)=>x.mes.localeCompare(y.mes));let acumulado=0;const rows=arr.map(x=>{let total=x.planejado+x.parcelas+x.despesas,liquido=x.entradas-total;acumulado+=liquido;return '<tr><td>'+esc(x.mes)+'</td><td>'+money(x.entradas)+'</td><td>'+money(x.planejado)+'</td><td>'+money(x.parcelas)+'</td><td>'+money(x.despesas)+'</td><td>'+money(liquido)+'</td><td>'+money(acumulado)+'</td></tr>'}).join('');return '<div class="card"><h2>Fluxo mensal — composição</h2><p class="fine">Previsão nominal baseada nos registros existentes. Saídas informadas manualmente, prestações simuladas e despesas previstas são separadas para facilitar identificar duplicações. Não representa saldo bancário nem disponibilidade efetiva da Caixa.</p><div class="tablewrap"><table><tr><th>Mês</th><th>Entradas</th><th>Saídas manuais</th><th>Parcelas</th><th>Extras previstos</th><th>Líquido</th><th>Acumulado</th></tr>'+rows+'</table></div>'+(arr.length?'':'<p class="muted">Inclua movimentos mensais, parcelas ou despesas com data.</p>')+'</div>'+panel('meses','Entradas e saídas programadas','Registre desembolsos e liberações apenas uma vez. Liberações previstas não significam créditos confirmados.',x=>esc(x.competencia)+' • +'+money(x.entrada)+' / -'+money(x.saida)+' • '+esc(x.origem))}function materials(){let diff=list('materiais').reduce((a,x)=>a+(+x.valorNovo||0)-(+x.valorOriginal||0),0);return '<div class="card"><small>Diferença acumulada entre materiais</small><div class="metric">'+money(diff)+'</div><p class="fine">Valor positivo indica acréscimo, negativo indica economia, sem duplicar automaticamente como despesa.</p></div>'+panel('materiais','Substituições e diferenças','Registre o custo original e o custo atualizado da mesma quantidade.',x=>money(x.valorOriginal)+' → '+money(x.valorNovo)+' • diferença '+money((+x.valorNovo||0)-(+x.valorOriginal||0)))}
function doc(){return panel('documentos','Arquivos da obra','Links privados do OneDrive ou SharePoint. Nenhum documento é publicado no GitHub.',x=>esc(x.tipo)+' • '+esc(x.status)+(x.url?' • <a target="_blank" rel="noopener" href="'+esc(x.url)+'">Abrir arquivo</a>':''))}


function pciView(){const f=state.meta?.finance||{},p=f.pci||{},q=f.planilha||{};let names=[['Terreno','terreno'],['Construção','construcao'],['Total','total']];const cell=x=>x==null?'A importar':money(x);return '<div class="card"><h2>PCI da Caixa × Planilha</h2><p class="fine">Valores lidos exclusivamente dos metadados privados sincronizados, quando disponíveis.</p><div class="tablewrap"><table><tr><th>Referência</th><th>PCI</th><th>Planilha</th><th>Diferença</th></tr>'+names.map(([label,key])=>'<tr><td>'+label+'</td><td>'+cell(p[key])+'</td><td>'+cell(q[key])+'</td><td>'+(p[key]==null||q[key]==null?'—':money(q[key]-p[key]))+'</td></tr>').join('')+'</table></div><p class="fine">Não altere valores contratuais sem conferir com a Caixa. Fontes diferentes não são automaticamente inconsistências de pagamento.</p></div><div class="card"><h2>Origem dos recursos</h2>'+[['Financiamento',q.financiado],['FGTS previsto',q.fgtsPrevisto],['Recursos próprios',q.recursosProprios]].map(([l,v])=>'<div class="entry"><div><b>'+l+'</b><small>'+(v==null?'Não importado':money(v))+'</small></div></div>').join('')+'</div>'}
function contractCalendar(){const a=list('etapas'),sum=a.reduce((n,x)=>n+(+x.valor||0),0);return '<div class="card"><h2>Cronograma físico-financeiro</h2><p class="fine">Cada barra representa progresso informado, não pagamento ou medição aprovada. Defina o início e fim de cada etapa ao confirmar o calendário da construtora.</p>'+a.map(x=>{const percent=Math.max(0,Math.min(100,+x.progresso||0));return '<div class="entry"><div><b>'+esc(x.nome)+'</b><small>'+money(x.valor)+' • '+(x.mesInicio||'Início a confirmar')+' até '+(x.mesFim||'fim a confirmar')+' • '+percent+'%</small><div class="bar"><span style="width:'+percent+'%"></span></div></div><span class="chip">'+esc(x.status||'Planejada')+'</span></div>'}).join('')+'<h3>Total de etapas: '+money(sum)+'</h3></div>'}
function financeIndicators(){const a=list('parcelas').filter(x=>x.competencia).sort((x,y)=>x.competencia.localeCompare(y.competencia));if(!a.length)return '<div class="card"><p>Importe as parcelas da planilha para visualizar a evolução mensal.</p></div>';const max=Math.max(1,...a.map(x=>+x.valor||0));return '<div class="card"><h2>Parcelas projetadas — próximos registros</h2><p class="fine">Prestações de simulação não equivalem a valores cobrados pelo banco. Informe pagamentos reais separadamente.</p>'+a.slice(0,24).map(x=>'<div class="entry"><div><b>'+esc(x.competencia)+' • '+money(a.indexOf(x)<12?1500:x.valor)+'</b><small>'+ (a.indexOf(x)<12?'Parcela de construção informada • simulação original '+money(x.valor)+' • ':'')+esc(x.status||'Simulado')+(x.saldo==null?'':' • Saldo '+money(x.saldo))+'</small><div class="bar"><span style="width:'+Math.round(100*(+x.valor||0)/max)+'%"></span></div></div></div>').join('')+'</div>'}
function settings(){return '<div class="card"><h2>Onde os dados ficam salvos</h2><p>Arquivo privado: <code>dados-completos.json</code>, na pasta especial do aplicativo no seu OneDrive pessoal (<code>/me/drive/special/approot</code> no Microsoft Graph). O nome visível da pasta varia conforme o registro Microsoft.</p><p class="fine">O arquivo é diferente de financiamento construção casa.xlsx e não altera automaticamente essa planilha.</p></div><div class="card"><h2>Conta Microsoft e sincronização</h2><label>ID do aplicativo (cliente) do Entra<input id="client" value="'+esc(localStorage.getItem(KEY)||'')+'" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><div class="actions"><button onclick="login()">Entrar com Microsoft</button><button class="secondary" onclick="logout()">Sair</button><button class="secondary" onclick="refreshCloud()">Atualizar da nuvem</button><button class="secondary" onclick="saveCloud()">Sincronizar agora</button><button class="secondary" onclick="syncExcel()">Atualizar Excel no OneDrive</button></div><small>Salva automaticamente as alterações quando online e com sessão válida. Atualiza periodicamente enquanto estiver aberto. Não há notificações Android em segundo plano nesta versão.</small></div><div class="card"><h2>Backup e importação</h2><div class="actions"><button onclick="backup()">Exportar JSON</button><button class="secondary" onclick="document.getElementById(&quot;upload&quot;).click()">Importar JSON</button><button class="secondary" onclick="exportICS()">Exportar agenda</button><button class="secondary" onclick="loadPrivateBase()">Carregar base privada do OneDrive</button></div><input class="hidden" id="upload" type="file" accept="application/json,.json" onchange="importBackup(event)"><p class="fine">Importação adiciona registros por ID e atualiza os que tiverem data mais recente; não apaga registros existentes. Para importar dados externos, use o modelo JSON exportado como referência.</p></div><div class="card"><h2>Privacidade</h2><p>A interface é pública no GitHub Pages; os lançamentos são privados no OneDrive. A autorização Files.ReadWrite permite ler e gravar arquivos do OneDrive, portanto autorize apenas se confiar no código. Este aplicativo não lê automaticamente suas planilhas históricas.</p></div>'}
function openSettings(){tab='ajustes';render();document.getElementById('view').scrollIntoView({behavior:'smooth',block:'start'})}
function openLogin(){openSettings();setTimeout(()=>document.getElementById('client')?.focus(),70)}
function render(){if(!state)return;ensure();$('tabs').innerHTML=tabs.map(([k,l])=>'<button class="'+(tab===k?'sel':'')+'" data-k="'+k+'">'+l+'</button>').join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;render()});$('account').textContent=user?'Microsoft: '+user.username:'Microsoft desconectado';
$('view').innerHTML=tab==='inicio'?summary():tab==='etapas'?panel('etapas','Etapas da obra','Valores de contratos, percentuais físicos e meses de referência.',x=>money(x.valor)+' • '+(x.progresso||0)+'% • '+esc(x.status||'')):tab==='tarefas'?panel('tarefas','Lembretes e pendências','Prazos exportáveis para calendário. Alertas nativos com app fechado ainda não estão ativos.',x=>date(x.prazo)+' • '+esc(x.status)+' • '+esc(x.responsavel||'')):tab==='gastos'?'<div class="cards"><div class="card"><small>Pagos</small><div class="metric">'+money(total('gastos',x=>x.status==='Pago'))+'</div></div><div class="card"><small>Previstos</small><div class="metric">'+money(total('gastos',x=>x.status==='Previsto'))+'</div></div></div>'+panel('gastos','Despesas e extras','Separar realizado de planejado. A alteração da arquiteta deve permanecer prevista até o pagamento.',x=>money(x.valor)+' • '+esc(x.status)+' • '+esc(x.categoria||'')):tab==='materiais'?materials():tab==='financiamento'?financing():tab==='fluxo'?flow():tab==='cronograma'?contractCalendar():tab==='pci'?pciView():tab==='documentos'?doc():settings()}
function blob(s,name,mime){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function backup(){blob(JSON.stringify(state,null,2),'minha-obra-backup-'+today()+'.json','application/json')}
async function importBackup(ev){try{const incoming=JSON.parse(await ev.target.files[0].text());if(!incoming.items)throw Error('Arquivo incompatível');if(!confirm('Importar registros e sincronizar? Os registros existentes serão preservados por ID.'))return;merge(incoming);persist();msg('Dados importados. Sincronização em andamento.')}catch(e){msg('Falha na importação: '+e.message)}}
async function loadPrivateBase(){try{if(!confirm('Importar a base inicial privada da construção e preservar os lançamentos atuais?'))return;msg('Procurando a base privada...');const q=encodeURIComponent('Minha Obra - base privada 2026-10-10.json');const found=await graph("/me/drive/root/search(q='"+q+"')");const it=found?.value?.find(x=>x.name==='Minha Obra - base privada 2026-10-10.json');if(!it)throw Error('Arquivo base não encontrado');const data=await graph('/me/drive/items/'+encodeURIComponent(it.id)+'/content');if(!data?.items)throw Error('Base inválida');merge(data);persist();msg('Base privada importada. Sincronizando...')}catch(e){msg('Importação: '+e.message)}}
function merge(cloud){ensure();if(cloud.meta?.finance)state.meta.finance={...(state.meta.finance||{}),...cloud.meta.finance};for(const k of Object.keys(empty().items)){const entries=new Map((cloud.items?.[k]||[]).map(x=>[x.id,x]));for(const x of list(k)){const y=entries.get(x.id);if(!y||(x.updated||'')>(y.updated||''))entries.set(x.id,x)}state.items[k]=[...entries.values()]}}
// Autenticação Microsoft: contas pessoais + SPA + PKCE
async function ready(){if(!window.msal)throw Error('Biblioteca de autenticação MSAL indisponível');const input=$('client');const id=(input?.value||localStorage.getItem(KEY)||'').trim();if(!/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(id))throw Error('Informe o ID do aplicativo na aba Config.');localStorage.setItem(KEY,id);if(!auth){auth=new msal.PublicClientApplication({auth:{clientId:id,authority:AUTH,redirectUri:URI},cache:{cacheLocation:'sessionStorage'}});if(auth.initialize)await auth.initialize();await auth.handleRedirectPromise()}user=auth.getAllAccounts()[0]||null;render();return user}
async function login(){try{const u=await ready();if(!u){await auth.loginRedirect({scopes:SCOPES});return}msg('Conectado: '+u.username);await refreshCloud()}catch(e){msg('Erro de login: '+e.message)}}
async function logout(){try{await ready();if(user)await auth.logoutRedirect({account:user,postLogoutRedirectUri:URI})}catch(e){msg(e.message)}}
async function token(){await ready();if(!user)throw Error('Faça login na aba Config.');try{return (await auth.acquireTokenSilent({account:user,scopes:SCOPES})).accessToken}catch(e){if(e instanceof msal.InteractionRequiredAuthError){await auth.acquireTokenRedirect({scopes:SCOPES});throw Error('Aguardando autorização Microsoft')}throw e}}
async function graph(path,method='GET',body,etag){const t=await token(),h={Authorization:'Bearer '+t};if(body!==undefined)h['Content-Type']='application/json';if(etag)h['If-Match']=etag;const r=await fetch('https://graph.microsoft.com/v1.0'+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});if(r.status===404)return null;if(!r.ok)throw Error('Microsoft Graph: '+r.status+' '+(await r.text()).slice(0,200));let txt=await r.text();return txt?JSON.parse(txt):{}}
async function cloudPath(){let folder=await graph('/me/drive/special/approot');if(!folder?.id)throw Error('Pasta de dados do aplicativo não encontrada');return '/me/drive/items/'+encodeURIComponent(folder.id)+':/dados-completos.json'}
async function getCloud(){const p=await cloudPath(),info=await graph(p);if(!info)return {p,data:empty(),etag:null};const data=await graph(p+':/content');if(!data?.items)throw Error('Dados remotos inválidos');return {p,data,etag:info.eTag||null}}
async function refreshCloud(){if(syncing)return;syncing=true;try{const remote=await getCloud();merge(remote.data);baseRev=remote.etag;lastCloud=remote.data;localStorage.setItem(STORAGE,JSON.stringify(state));msg('OneDrive consultado • '+new Date().toLocaleTimeString('pt-BR'));render()}catch(e){msg('Falha na leitura: '+e.message)}finally{syncing=false}}

async function syncExcel(){try{
if(!window.XLSX)throw Error('Biblioteca Excel indisponível. Recarregue a página ou verifique conexão.');
if(!user)throw Error('Conecte sua conta Microsoft.');
const destination=['Djanilton','Finanças','Compras','Imóvel','Novo Leblon','Construção RB','Minha Obra - Acompanhamento.xlsx'].map(encodeURIComponent).join('/');const base='/me/drive/root:/'+destination;
const workbook=XLSX.utils.book_new();
const entries=[['Etapas',['nome','valor','mesInicio','mesFim','progresso','status','nota']],
['Pendencias',['nome','prazo','responsavel','prioridade','status','nota']],
['Despesas',['nome','valor','data','categoria','status','etapa','nota']],
['Materiais',['nome','quantidade','valorOriginal','valorNovo','status','nota']],
['Parcelas',['nome','competencia','valor','status','saldo','nota']],
['Fluxo',['nome','competencia','entrada','saida','origem','nota']],
['Documentos',['nome','url','tipo','status','nota']]];
const sources=['etapas','tarefas','gastos','materiais','parcelas','meses','documentos'];
entries.forEach(([name,cols],i)=>{const records=list(sources[i]);const rows=[cols,...records.map(x=>cols.map(k=>x[k]??''))];const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=cols.map(k=>({wch:Math.min(40,Math.max(13,k.length+5))}));XLSX.utils.book_append_sheet(workbook,ws,name)});
const parameters=state.meta?.finance||{};
const pci=parameters.pci||{},p=parameters.planilha||{};
XLSX.utils.book_append_sheet(workbook,XLSX.utils.aoa_to_sheet([
['Origem','Item','Valor'],['PCI','Terreno',pci.terreno??''],['PCI','Construcao',pci.construcao??''],['PCI','Total',pci.total??''],
['Planilha','Terreno',p.terreno??''],['Planilha','Construcao',p.construcao??''],['Planilha','Total',p.total??''],
['Planilha','Financiamento',p.financiado??''],['Planilha','FGTS',p.fgtsPrevisto??''],['Planilha','Recursos proprios',p.recursosProprios??''],
['Controle','Atualizado em',new Date().toISOString()],['Controle','Observacao','Espelho dos registros privados Minha Obra. Planilha financeira original preservada.']
]),'Referencias');
const bin=XLSX.write(workbook,{bookType:'xlsx',type:'array'});
const t=await token();
const response=await fetch('https://graph.microsoft.com/v1.0'+base+':/content',{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'},body:bin});
if(!response.ok)throw Error('Excel HTTP '+response.status+': '+(await response.text()).slice(0,150));
return true;
}catch(e){msg('JSON preservado; falhou o espelho Excel: '+e.message);return false}
}
async function saveCloud(){if(syncing)return;syncing=true;try{let remote=await getCloud();merge(remote.data);const h={Authorization:'Bearer '+await token(),'Content-Type':'application/json'};if(remote.etag)h['If-Match']=remote.etag;else h['If-None-Match']='*';const r=await fetch('https://graph.microsoft.com/v1.0'+remote.p+':/content',{method:'PUT',headers:h,body:JSON.stringify(state)});if(r.status===409||r.status===412)throw Error('Conflito: outra sessão alterou os dados. Sincronize novamente.');if(!r.ok)throw Error('Erro HTTP '+r.status+' '+(await r.text()).slice(0,180));dirty=false;localStorage.setItem(STORAGE,JSON.stringify(state));const excelOk=await syncExcel();msg((excelOk?'JSON e Excel salvos':'JSON salvo; espelho Excel pendente')+' às '+new Date().toLocaleTimeString('pt-BR'));render()}catch(e){msg('Não foi possível sincronizar: '+e.message);dirty=true}finally{syncing=false}}
let queue;function scheduleSync(){clearTimeout(queue);queue=setTimeout(()=>{if(user&&navigator.onLine)saveCloud()},1600)}
function exportICS(){let arr=list('tarefas').filter(x=>x.prazo&&x.status!=='Concluída');const dt=d=>d.replaceAll('-','');const safe=s=>String(s).replaceAll('\\','\\\\').replaceAll(',','\\,').replaceAll(';','\\;').replaceAll('\n','\\n');const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Minha Obra//PT-BR'];for(let x of arr){const end=new Date(x.prazo+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+1);body.push('BEGIN:VEVENT','UID:'+x.id+'@minhaobra','DTSTART;VALUE=DATE:'+dt(x.prazo),'DTEND;VALUE=DATE:'+end.toISOString().slice(0,10).replaceAll('-',''),'SUMMARY:'+safe(x.nome),'DESCRIPTION:'+safe(x.nota||''),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+safe(x.nome),'END:VALARM','END:VEVENT')}body.push('END:VCALENDAR');blob(body.join('\r\n'),'minha-obra-lembretes.ics','text/calendar')}
state=init();ensure();render();(async()=>{try{if(localStorage.getItem(KEY)){await ready();if(user)await refreshCloud();else msg('Entre com Microsoft na aba Config.')}else msg('Abra Config. para conectar sua conta Microsoft.')}catch(e){msg('Autenticação: '+e.message)}})();
setInterval(()=>{if(user&&navigator.onLine&&!syncing){if(dirty)saveCloud();else refreshCloud()}},60000);
window.addEventListener('online',()=>{if(user)saveCloud()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user&&!syncing)refreshCloud()});
</script></body></html>
