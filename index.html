function empty(){return {version:2,items:{etapas:[],tarefas:[],gastos:[],materiais:[],parcelas:[],documentos:[],meses:[]},meta:{updated:new Date().toISOString(),project:'Minha Obra'}}}

function list(k){return state.items[k]||[]}
const total=(k,filter=()=>true)=>list(k).filter(filter).reduce((a,x)=>a+(+x.valor||0),0);
function amount(k){return money(total(k))}

function addOwnExpense(){attachForm('gastos');const formEl=$('form');if(formEl){const category=formEl.querySelector('[name="categoria"]');if(category)category.value='Extra';const status=formEl.querySelector('[name="status"]');if(status)status.value='Previsto';const name=formEl.querySelector('[name="nome"]');if(name)name.focus()}}
function attachForm(k,editId){let it=list(k).find(x=>x.id===editId);let specs={
etapas:[['nome','Etapa'],['valor','Valor contratado (R$)','number'],['mesInicio','Mês início (AAAA-MM)','month'],['mesFim','Mês final (AAAA-MM)','month'],['progresso','Progresso %','number','0'],['status','Situação','text','Planejada',['Planejada','Em andamento','Concluída']]],
tarefas:[['nome','Pendência'],['prazo','Prazo','date'],['responsavel','Responsável'],['prioridade','Prioridade','text','Média',['Baixa','Média','Alta']],['status','Status','text','Pendente',['Pendente','Em andamento','Concluída']]],
gastos:[['nome','Descrição'],['valor','Valor previsto (R$)','number'],['valorPago','Valor pago (R$)','number','0'],['dataPagamento','Data de pagamento','date',''],['categoria','Categoria','text','Extra',['Construtora','Caixa','Arquiteta','Projeto','Material','Documentação','Financiamento','Extra']],['status','Condição','text','Previsto',['Previsto','Pago']],['etapa','Etapa / referência']],
materiais:[['nome','Material / substituição'],['quantidade','Quantidade','number','1'],['valorOriginal','Preço original total (R$)','number','0'],['valorNovo','Preço atualizado total (R$)','number','0'],['valorPago','Valor pago da diferença (R$)','number','0'],['dataPagamento','Data de pagamento','date',''],['status','Condição','text','Orçado',['Orçado','Comprado']]],
parcelas:[['nome','Identificação da parcela'],['competencia','Mês','month'],['valor','Valor (R$)','number'],['status','Condição','text','Simulado',['Simulado','Previsto','Pago']],['saldo','Saldo devedor','number']],
documentos:[['nome','Documento'],['url','URL privada no OneDrive ou SharePoint','url'],['tipo','Tipo','text','Contrato',['Contrato','Caixa','Projeto','Comprovante','Foto','Outros']],['status','Situação','text','Referência',['Referência','Pendente','Validado']]],
meses:[['nome','Descrição do fluxo'],['competencia','Mês','month'],['entrada','Entrada prevista (R$)','number','0'],['saida','Saída prevista (R$)','number','0'],['origem','Origem','text','Manual',['Manual','Cronograma','Financiamento','Caixa','FGTS','Outros']]]};
$('view').innerHTML='<div class="card"><h2>'+(it?'Editar':'Novo')+' registro</h2>'+form(k,specs[k],it)+'</div>';
$('form').onsubmit=e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target));Object.keys(obj).forEach(x=>{if(['valor','valorPago','valorOriginal','valorNovo','quantidade','entrada','saida','saldo','progresso'].includes(x))obj[x]=Number(obj[x]||0)});if(!obj.nome?.trim())return alert('Preencha a descrição');const item={...it,...obj,id:it?.id||uuid(),updated:new Date().toISOString()};if(it)state.items[k]=list(k).map(x=>x.id===it.id?item:x);else state.items[k].push(item);persist()}}
function remove(k,id){if(!confirm('Excluir este registro?'))return;state.meta.deletedRecords??={};state.meta.deletedRecords[k]??={};state.meta.deletedRecords[k][id]=new Date().toISOString();state.items[k]=list(k).filter(x=>x.id!==id);persist()}
function rows(k,extra){const a=list(k);return a.length?a.map(x=>'<div class="entry"><div class="row"><div><b>'+esc(x.nome)+'</b><small>'+esc(extra(x))+'</small></div><div class="actions"><button class="secondary" onclick="attachForm(\''+k+'\',\''+x.id+'\')">Editar</button><button class="danger" onclick="remove(\''+k+'\',\''+x.id+'\')">×</button></div></div></div>').join(''):'<p class="muted">Ainda não há registros nesta categoria.</p>'}
function summary(){let p=total('gastos',x=>x.status==='Pago'),v=total('gastos',x=>x.status==='Previsto');let stages=list('etapas'),av=stages.length?stages.reduce((a,x)=>a+(+x.progresso||0),0)/stages.length:0;let overdue=list('tarefas').filter(x=>x.prazo&&x.prazo<today()&&x.status!=='Concluída').length;
return (!user?'<div class="card"><h2>🔐 Conectar OneDrive</h2><p>Entre com sua conta Microsoft para carregar os dados privados da obra.</p><button onclick="openLogin()">Conectar Microsoft</button></div>':'')+'<div class="cards"><div class="card"><small>Pago / lançado</small><div class="metric">'+money(p)+'</div></div><div class="card"><small>A pagar</small><div class="metric">'+money(v)+'</div></div><div class="card"><small>Progresso médio</small><div class="metric">'+av.toFixed(1)+'%</div><progress max="100" value="'+av+'"></progress></div><div class="card"><small>Pendências atrasadas</small><div class="metric">'+overdue+'</div></div></div><div class="card"><h2>Próximas pendências</h2>'+list('tarefas').filter(x=>x.status!=='Concluída').sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999')).slice(0,6).map(x=>'<div class="entry"><b>'+esc(x.nome)+'</b><small>'+date(x.prazo)+' • '+esc(x.prioridade||'')+'</small></div>').join('')+'</div><div class="card"><h2>Origem e integridade dos dados</h2><p>Dados privados sincronizados com a pasta de aplicativo do seu OneDrive. A importação do histórico é separada e não considera simulações como pagamentos realizados.</p></div>'}
function panel(k,title,desc,extra){return '<div class="card"><div class="row"><h2>'+title+'</h2><button onclick="attachForm(\''+k+'\')">+ Adicionar</button></div><p class="muted">'+desc+'</p>'+rows(k,extra)+'</div>'}
function financing(){const a=list('parcelas');const vals=a.filter(x=>x.status==='Simulado'),paid=a.filter(x=>x.status==='Pago');return financeIndicators()+'<div class="cards"><div class="card"><small>Parcelas simuladas</small><div class="metric">'+vals.length+'</div></div><div class="card"><small>Parcelas pagas</small><div class="metric">'+paid.length+'</div></div><div class="card"><small>Total pago informado</small><div class="metric">'+money(paid.reduce((a,x)=>a+(+x.valor||0),0))+'</div></div><div class="card"><small>Próxima simulação</small><div class="metric">'+money(vals.sort((a,b)=>a.competencia.localeCompare(b.competencia))[0]?.valor)+'</div></div></div>'+panel('parcelas','Financiamento e parcelas','Valores simulados não são débitos reais. Compare com as cobranças da Caixa antes de marcar como pagos.',x=>x.competencia+' • '+money(x.valor)+' • '+x.status+(x.saldo?' • saldo '+money(x.saldo):''))}
function flow(){const map={};const cell=m=>map[m]||(map[m]={mes:m,entradas:0,planejado:0,parcelas:0,despesas:0});list('meses').forEach(x=>{if(!x.competencia)return;let d=cell(x.competencia);d.entradas+=+x.entrada||0;d.planejado+=+x.saida||0});list('parcelas').filter(x=>x.status!=='Pago'&&x.competencia).sort((a,b)=>a.competencia.localeCompare(b.competencia)).forEach((x,i)=>{cell(x.competencia).parcelas+=i<12?1500:(+x.valor||0)});list('gastos').filter(x=>x.status==='Previsto'&&x.data).forEach(x=>{cell(x.data.slice(0,7)).despesas+=+x.valor||0});const arr=Object.values(map).sort((x,y)=>x.mes.localeCompare(y.mes));let acumulado=0;const rows=arr.map(x=>{let total=x.planejado+x.parcelas+x.despesas,liquido=x.entradas-total;acumulado+=liquido;return '<tr><td>'+esc(x.mes)+'</td><td>'+money(x.entradas)+'</td><td>'+money(x.planejado)+'</td><td>'+money(x.parcelas)+'</td><td>'+money(x.despesas)+'</td><td>'+money(liquido)+'</td><td>'+money(acumulado)+'</td></tr>'}).join('');return '<div class="card"><h2>Fluxo mensal — composição</h2><p class="fine">Previsão nominal baseada nos registros existentes. Saídas informadas manualmente, prestações simuladas e despesas previstas são separadas para facilitar identificar duplicações. Não representa saldo bancário nem disponibilidade efetiva da Caixa.</p><div class="tablewrap"><table><tr><th>Mês</th><th>Entradas</th><th>Saídas manuais</th><th>Parcelas</th><th>Extras previstos</th><th>Líquido</th><th>Acumulado</th></tr>'+rows+'</table></div>'+(arr.length?'':'<p class="muted">Inclua movimentos mensais, parcelas ou despesas com data.</p>')+'</div>'+panel('meses','Entradas e saídas programadas','Registre desembolsos e liberações apenas uma vez. Liberações previstas não significam créditos confirmados.',x=>esc(x.competencia)+' • +'+money(x.entrada)+' / -'+money(x.saida)+' • '+esc(x.origem))}

function newContractStage(){attachForm('gastos');const f=$('form');if(!f)return;const c=f.elements.namedItem('categoria');if(c)c.value='Construtora'}
function contractorEntries(){const entries=list('gastos').filter(x=>x.categoria==='Construtora'||/construtora/i.test(x.nome||''));return entries.length?entries.map(x=>'<div class="entry"><div class="row"><div><b>'+esc(x.nome)+'</b><small>'+money(x.valor)+' previsto · '+money(x.valorPago!==undefined?x.valorPago:(x.status==='Pago'?x.valor:0))+' pago · '+date(x.dataPagamento||x.data)+'</small></div><div class="actions"><button onclick="attachForm(\'gastos\',\''+esc(x.id)+'\')">Editar</button><button class="danger" onclick="remove(\'gastos\',\''+esc(x.id)+'\')">Excluir</button></div></div></div>').join(''):'<p class="muted">Nenhum pagamento de etapa cadastrado.</p>'}

function contractorPanel(onlyConsolidated=false){

const contractValue=stages.reduce((sum,x)=>sum+Number(x.valor||0),0)||660000;

const metric=(label,value)=>'<div class="card"><small>'+label+'</small><div class="metric">'+money(value)+'</div></div>';

if(onlyConsolidated)return top;return '<div class="card"><div class="row"><h2>Pagamentos construtora</h2><div class="actions"><button onclick="newContractStage()">+ Adicionar etapa</button><button onclick="attachForm(\'materiais\')">+ Diferença de materiais</button></div></div><p class="fine">Previsão contratual com diferenças de materiais consideradas apenas uma vez no consolidado.</p><h3>Previsão de pagamentos por etapa</h3>'+(stageRows?'<div class="sheet-scroll"><table><thead><tr><th>Etapa</th><th>Início</th><th>Fim</th><th>Previsto</th></tr></thead><tbody>'+stageRows+'</tbody></table></div>':'<p>Valor de referência contratual: '+money(contractValue)+'</p>')+'<h3>Pagamentos de etapas</h3>'+contractorEntries()+'<h3>Diferenças de materiais</h3><p class="fine">Total das diferenças: '+money(diff)+'</p>'+materialsInline()+'</div>';
}

const COST_BASE=[['Móveis',35000],['Sofá',5000],['Mesa de jantar e gourmet',5000],['3 espelhos grandes',1000],['5 espelhos pequenos',2250],['5 boxes de banheiro',6000],['Videoporteiro e fechadura inteligente',2300],['Portões',3500],['Eletrodomésticos',9400],['Energia solar',10000],['Arquiteta',1000],['Documentação',0]];
function moneyInputValue(v){return Number(v||0).toFixed(2)}
function parseAmountExcel(s){const v=String(s??'').replace(/R\$|\s/g,'');if(!v||!/\d/.test(v))return null;const n=Number(v.includes(',')&&v.includes('.')?v.replace(/\./g,'').replace(',','.'):v.includes(',')?/^[-+]?\d{1,3}(,\d{3})+$/.test(v)?v.replaceAll(',',''):v.replace(',','.'):v);return Number.isFinite(n)?n:null}
function costsFromExcel(){const found={};for(const row of sourceSheets.parametrosExcel||[])for(let i=0;i<row.length-1;i++){const label=String(row[i]??''),num=parseAmountExcel(row[i+1]);if(num===null)continue;if(/port[oõ]es/i.test(label))found['Portões']=num;if(/eletros/i.test(label))found['Eletrodomésticos']=num;if(/energia solar/i.test(label))found['Energia solar']=num}return found}
function ownCostRows(){const m=state.meta||{},deleted=m.costDeleted||[],o=m.costOverrides||{},p=m.costPaid||{},excel=costsFromExcel();return [...COST_BASE.filter(x=>!deleted.includes(x[0])).map(([name,val])=>({id:name,name,planned:Number(o[name]??excel[name]??val),paid:Number(p[name]||0),custom:false})),...(m.extraOwnCosts||[]).map(x=>({...x,planned:Number(x.planned||0),paid:Number(x.paid||0),custom:true}))]}
function ownCostsTotal(){return ownCostRows().reduce((n,x)=>n+x.planned,0)}
function classifyCosts(){const rows=ownCostRows();const totals='<div class="cards"><div class="card"><small>Total previsto</small><div class="metric">'+money(rows.reduce((n,x)=>n+x.planned,0))+'</div></div><div class="card"><small>Total pago</small><div class="metric">'+money(rows.reduce((n,x)=>n+x.paid,0))+'</div></div></div>';const tr=rows.map((x,i)=>'<tr><td>'+esc(x.name)+'</td><td><input type="number" min="0" step=".01" value="'+moneyInputValue(x.planned)+'" onchange="updateOwnCost('+i+',\'planned\',this.value)"></td><td><input type="number" min="0" step=".01" value="'+moneyInputValue(x.paid)+'" onchange="updateOwnCost('+i+',\'paid\',this.value)"></td><td><button class="danger" onclick="deleteOwnCost('+i+')">Excluir</button></td></tr>').join('');return '<div class="card"><div class="row"><h2>Despesas extras — recursos próprios</h2><button onclick="addOwnExpense()">+ Adicionar despesa</button></div><p class="fine">Itens separados pela fórmula: 35.000 + 5.000 + 5.000 + 1.000 + 2.250 + 6.000 + 2.300 = R$ 56.550. Os registros são privados; a planilha original não é modificada.</p>'+totals+'<div class="sheet-scroll"><table><thead><tr><th>Item</th><th>Previsto (R$)</th><th>Valor pago (R$)</th><th>Ação</th></tr></thead><tbody>'+tr+'</tbody></table></div><p><b>Total previsto: '+money(rows.reduce((n,x)=>n+x.planned,0))+'</b> · Total pago: '+money(rows.reduce((n,x)=>n+x.paid,0))+'</p></div>'}
function updateOwnCost(i,field,value){const x=ownCostRows()[i],n=Number(value);if(!x||!Number.isFinite(n)||n<0)return msg('Valor inválido');state.meta??={};if(x.custom){const target=(state.meta.extraOwnCosts||[]).find(v=>v.id===x.id);if(target)target[field]=n}else{const key=field==='paid'?'costPaid':'costOverrides';state.meta[key]??={};state.meta[key][x.id]=n}persist()}
function deleteOwnCost(i){const x=ownCostRows()[i];if(!x||!confirm('Excluir esta despesa do quadro?'))return;state.meta??={};if(x.custom)state.meta.extraOwnCosts=(state.meta.extraOwnCosts||[]).filter(v=>v.id!==x.id);else{state.meta.costDeleted??=[];state.meta.costDeleted.push(x.id)}persist()}
function addOwnExpense(){const name=prompt('Nome da despesa própria:');if(!name?.trim())return;state.meta??={};state.meta.extraOwnCosts??=[];state.meta.extraOwnCosts.push({id:uuid(),name:name.trim(),planned:0,paid:0});persist()}

function contractTasks(){const items=state.meta.contractTasks||[];const today=new Date().toISOString().slice(0,10);const ordered=items.map((x,i)=>({...x,i})).sort((a,b)=>(a.status==='Concluído')-(b.status==='Concluído')||String(a.date||'9999').localeCompare(String(b.date||'9999')));const late=items.filter(x=>x.status!=='Concluído'&&x.date&&x.date<today).length,soon=items.filter(x=>x.status!=='Concluído'&&x.date&&x.date>=today&&x.date<=new Date(Date.now()+7*86400000).toISOString().slice(0,10)).length;
return '<div class="card"><h2>Obrigações e alertas contratuais</h2><p class="fine">Os vencimentos são definidos por você. Etapas condicionadas à Caixa ou ao andamento da obra não recebem datas presumidas. Alertas aparecem ao abrir o app; não são notificações Android em segundo plano.</p><p><b>'+late+' atrasadas</b> · '+soon+' vencendo em até 7 dias · '+items.filter(x=>x.status==='Concluído').length+' concluídas</p><div class="param-grid">'+ordered.map(x=>'<section class="param-card"><h3>'+esc(x.title)+'</h3><small>'+esc(x.note)+' · '+esc(x.owner)+'</small><div class="grid"><label>Prazo<input type="date" value="'+esc(x.date||'')+'" onchange="contractTaskChange('+x.i+',\'date\',this.value)"></label><label>Status<select onchange="contractTaskChange('+x.i+',\'status\',this.value)">'+['Pendente','Em andamento','Concluído','Aguardando Caixa'].map(v=>'<option '+(x.status===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div><p class="fine">'+(x.status!=='Concluído'&&x.date&&x.date<today?'Prazo vencido':x.status!=='Concluído'&&x.date&&x.date<=new Date(Date.now()+7*86400000).toISOString().slice(0,10)?'Prazo próximo':'')+'</p><button class="secondary" onclick="contractTaskDelete('+x.i+')">Remover</button></section>').join('')+'</div><h3>Adicionar obrigação</h3><form id="contractAdd"><div class="grid"><label>Atividade<input name="title" required></label><label>Responsável<select name="owner"><option>Construtora</option><option>Proprietário</option><option>Caixa</option><option>Ambos</option></select></label><label>Data prevista<input type="date" name="date"></label><label>Referência<input name="note" placeholder="Cláusula ou etapa"></label></div><button type="submit">Adicionar obrigação</button></form></div>'}

function pciView(){const f=state.meta?.finance||{},p=f.pci||{},q=f.planilha||{};let names=[['Terreno','terreno'],['Construção','construcao'],['Total','total']];const cell=x=>x==null?'A importar':money(x);return '<div class="card"><h2>Terreno — conciliação da escritura</h2><p>Valor efetivamente pago: <b>'+cell(q.terreno)+'</b></p><p>Valor declarado na escritura: <b>'+cell(p.terreno)+'</b></p><p>Diferença a documentar: <b>'+(q.terreno==null||p.terreno==null?'Não calculada':money(q.terreno-p.terreno))+'</b></p><p class="fine">Diferença de informação documental; não é despesa extra nem indicação automática de irregularidade. Guarde escritura e comprovantes e consulte o cartório/profissional responsável se precisar corrigir.</p></div><div class="card"><h2>PCI da Caixa × Planilha</h2><p class="fine">Valores lidos exclusivamente dos metadados privados sincronizados, quando disponíveis.</p><div class="tablewrap"><table><tr><th>Referência</th><th>PCI</th><th>Planilha</th><th>Diferença</th></tr>'+names.map(([label,key])=>'<tr><td>'+label+'</td><td>'+cell(p[key])+'</td><td>'+cell(q[key])+'</td><td>'+(p[key]==null||q[key]==null?'—':money(q[key]-p[key]))+'</td></tr>').join('')+'</table></div><p class="fine">Não altere valores contratuais sem conferir com a Caixa. Fontes diferentes não são automaticamente inconsistências de pagamento.</p></div><div class="card"><h2>Origem dos recursos</h2>'+[['Financiamento',q.financiado],['FGTS previsto',q.fgtsPrevisto],['Recursos próprios',q.recursosProprios]].map(([l,v])=>'<div class="entry"><div><b>'+l+'</b><small>'+(v==null?'Não importado':money(v))+'</small></div></div>').join('')+'</div>'}
function contractCalendar(){const a=list('etapas'),sum=a.reduce((n,x)=>n+(+x.valor||0),0);return '<div class="card"><h2>Cronograma físico-financeiro</h2><p class="fine">Cada barra representa progresso informado, não pagamento ou medição aprovada. Defina o início e fim de cada etapa ao confirmar o calendário da construtora.</p>'+a.map(x=>{const percent=Math.max(0,Math.min(100,+x.progresso||0));return '<div class="entry"><div><b>'+esc(x.nome)+'</b><small>'+money(x.valor)+' • '+(x.mesInicio||'Início a confirmar')+' até '+(x.mesFim||'fim a confirmar')+' • '+percent+'%</small><div class="bar"><span style="width:'+percent+'%"></span></div></div><span class="chip">'+esc(x.status||'Planejada')+'</span></div>'}).join('')+'<h3>Total de etapas: '+money(sum)+'</h3></div>'}

function stagePaymentSummary(){
const st=list('etapas'),g=list('gastos').filter(x=>x.categoria==='Construtora'||/construtora/i.test(String(x.nome||'')));
const normalize=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const amount=x=>Number(x.valorPago!==undefined?x.valorPago:(x.status==='Pago'?x.valor:0))||0;
const match=x=>{const ref=normalize(x.etapa);if(!ref)return -1;return st.findIndex((e,i)=>ref===normalize(e.nome)||ref===String(i+1)||ref===normalize((i+1)+'ª etapa')||ref===normalize((i+1)+'a etapa'))};
const totals=st.map(()=>0),pending=[];
for(const x of g){const i=match(x);if(i>=0)totals[i]+=amount(x);else if(amount(x)>0)pending.push(x)}
const rows=st.map((x,i)=>{const paid=totals[i],planned=Number(x.valor)||0;return '<tr><td>'+esc(x.nome)+'</td><td>'+money(planned)+'</td><td>'+money(paid)+'</td><td>'+money(Math.max(0,planned-paid))+'</td><td>'+((+x.progresso)||0)+'%</td></tr>'}).join('');
return '<div class="card"><h2>Pagamentos por etapa</h2><p class="fine">Os valores pagos são somados dos registros da categoria Construtora vinculados à etapa pelo campo “Etapa / referência”. O percentual físico continua independente dos pagamentos.</p><div class="sheet-scroll"><table><thead><tr><th>Etapa</th><th>Previsto</th><th>Pago</th><th>A pagar</th><th>Execução física</th></tr></thead><tbody>'+rows+'</tbody></table></div><p><b>Total pago vinculado: '+money(totals.reduce((a,v)=>a+v,0))+'</b></p>'+(pending.length?'<p class="fine">Pagamentos à construtora sem etapa identificada: '+money(pending.reduce((a,x)=>a+amount(x),0))+'. Edite a despesa e preencha Etapa / referência para distribuí-los.</p>':'')+'</div>'}
function physicalFinancialSchedule(){return contractCalendar()+stagePaymentSummary()+panel('etapas','Editar etapas','Altere valores, datas e percentuais físicos aqui. Pagamentos são lançados na aba Despesas.',x=>money(x.valor)+' • '+(x.progresso||0)+'% • '+esc(x.status||''))+pciView()}
function financeIndicators(){const a=list('parcelas').filter(x=>x.competencia).sort((x,y)=>x.competencia.localeCompare(y.competencia));if(!a.length)return '<div class="card"><p>Importe as parcelas da planilha para visualizar a evolução mensal.</p></div>';const max=Math.max(1,...a.map(x=>+x.valor||0));return '<div class="card"><h2>Parcelas projetadas — próximos registros</h2><p class="fine">Prestações de simulação não equivalem a valores cobrados pelo banco. Informe pagamentos reais separadamente.</p>'+a.slice(0,24).map(x=>'<div class="entry"><div><b>'+esc(x.competencia)+' • '+money(a.indexOf(x)<12?1500:x.valor)+'</b><small>'+ (a.indexOf(x)<12?'Parcela de construção informada • simulação original '+money(x.valor)+' • ':'')+esc(x.status||'Simulado')+(x.saldo==null?'':' • Saldo '+money(x.saldo))+'</small><div class="bar"><span style="width:'+Math.round(100*(+x.valor||0)/max)+'%"></span></div></div></div>').join('')+'</div>'}

async function refreshCloud(){if(syncing)return;syncing=true;try{const remote=await getCloud();merge(remote.data);baseRev=remote.etag;lastCloud=remote.data;localStorage.setItem(STORAGE,JSON.stringify(state));msg('OneDrive consultado • '+new Date().toLocaleTimeString('pt-BR'));renderUnlessEditing()}catch(e){msg('Falha na leitura: '+e.message)}finally{syncing=false}}

async function saveCloud(){if(syncing)return;syncing=true;try{let remote=await getCloud();merge(remote.data);const h={Authorization:'Bearer '+await token(),'Content-Type':'application/json'};if(remote.etag)h['If-Match']=remote.etag;else h['If-None-Match']='*';const r=await fetch('https://graph.microsoft.com/v1.0'+remote.p+':/content',{method:'PUT',headers:h,body:JSON.stringify(state)});if(r.status===409||r.status===412)throw Error('Conflito: outra sessão alterou os dados. Sincronize novamente.');if(!r.ok)throw Error('Erro HTTP '+r.status+' '+(await r.text()).slice(0,180));dirty=false;localStorage.setItem(STORAGE,JSON.stringify(state));const excelOk=await syncExcel();msg((excelOk?'JSON e Excel salvos':'JSON salvo; espelho Excel pendente')+' às '+new Date().toLocaleTimeString('pt-BR'));renderUnlessEditing()}catch(e){msg('Não foi possível sincronizar: '+e.message);dirty=true}finally{syncing=false}}
let queue;function scheduleSync(){clearTimeout(queue);queue=setTimeout(()=>{if(user&&navigator.onLine)saveCloud()},1600)}
function exportICS(){let arr=list('tarefas').filter(x=>x.prazo&&x.status!=='Concluída');const dt=d=>d.replaceAll('-','');const safe=s=>String(s).replaceAll('\\','\\\\').replaceAll(',','\\,').replaceAll(';','\\;').replaceAll('\n','\\n');const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Minha Obra//PT-BR'];for(let x of arr){const end=new Date(x.prazo+'T12:00:00Z');end.setUTCDate(end.getUTCDate()+1);body.push('BEGIN:VEVENT','UID:'+x.id+'@minhaobra','DTSTART;VALUE=DATE:'+dt(x.prazo),'DTEND;VALUE=DATE:'+end.toISOString().slice(0,10).replaceAll('-',''),'SUMMARY:'+safe(x.nome),'DESCRIPTION:'+safe(x.nota||''),'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:'+safe(x.nome),'END:VALARM','END:VEVENT')}body.push('END:VCALENDAR');blob(body.join('\r\n'),'minha-obra-lembretes.ics','text/calendar')}
state=init();ensure();render();(async()=>{try{if(localStorage.getItem(KEY)){await ready();if(user)await refreshCloud();else msg('Entre com Microsoft na aba Config.')}else msg('Abra Config. para conectar sua conta Microsoft.')}catch(e){msg('Autenticação: '+e.message)}})();
